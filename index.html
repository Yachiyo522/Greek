main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;font-weight:900;margin:8px 0 4px;letter-spacing:.04em}
.sub{color:var(--sub);margin:0 0 20px;font-size:.95rem}
.card,.head{background:color-mix(in srgb,var(--card) 93%,transparent);border:1px solid var(--line);border-radius:6px;padding:20px 18px}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:.9rem;margin-bottom:10px}
.bar{height:4px;background:var(--line);margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.q{font-size:1.1rem;margin:0 0 18px;font-weight:500}
.opts{display:grid;gap:10px}

button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.ng{background:var(--ng);border-color:var(--ng);color:#fff}
button:disabled{cursor:default}
.fb{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.fb b{font-size:1.1rem}
.fb p{margin:6px 0 14px;color:var(--sub)}
.primary{background:var(--sea);color:var(--bg);text-align:center;font-weight:900;width:100%}
.score{font-size:3rem;font-weight:900;color:var(--gold);margin:6px 0;line-height:1.2}
.hide{display:none}
.it{border-top:1px solid var(--line);padding:12px 0 12px 10px;border-left:4px solid var(--ok);margin-top:10px}
.it.x{border-left-color:var(--ng)}
.it .h{font-weight:900;margin-bottom:2px}
.it .a{color:var(--sub);font-size:.95rem;margin:4px 0}
.it .e{font-size:.95rem}
.it a{display:inline-block;margin-top:6px;color:var(--sea);font-weight:500;padding:6px 0}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

<body>
<main>
<div class="head" style="border-radius:6px;padding:10px 18px;margin-bottom:14px;border:1px solid var(--line)"><h1 style="margin-top:0">ギリシャ神話クイズ</h1>
<p class="sub" style="margin-bottom:0">神話の一節を読んで、どの神か当てましょう。全10問。</p></div>
<div class="card" id="start">
<p style="margin-top:0">オリュンポスの神々から、ティタン神族、英雄まで出題します。</p>
<button class="primary" id="go">はじめる</button>
</div>
<div class="card hide" id="game">
<div class="meta"><span id="no"></span><span id="sc"></span></div>
<div class="bar"><i id="pb"></i></div>
<p class="q" id="q"></p>
<div class="opts" id="opts"></div>
<div class="fb hide" id="fb"><b id="res"></b><p id="exp"></p><button class="primary" id="next">次の問題</button></div>
</div>
<div class="card hide" id="end">
<div class="meta"><span>結果</span></div>
<div class="score" id="fs"></div>
<p id="msg"></p>
<button class="primary" id="again">もう一度挑戦する</button>
<h2 style="font-size:1.1rem;margin:22px 0 8px">答え合わせ</h2>
<div id="rv"></div>
</div>
</main>
<script>
const D=[
["天空を支配する神々の王。父クロノスを倒して王座に就いた。","ゼウス","雷霆を武器にする最高神。クロノスを倒して世界を三分した。"],
["兄弟でくじを引いて、冥界の支配者となった神。","ハデス","ゼウス、ポセイドンと世界を分け、冥界を治めた。"],
["三叉の矛を持ち、アテネの守護神の座をアテナと争って敗れた神。","ポセイドン","海と地震の神。アクロポリスで塩水の泉を湧かせたが選ばれなかった。"],
["ゼウスの頭から、完全に武装した姿で生まれた女神。","アテナ","知恵と戦いの女神。ゼウスの頭をヘパイストスが斧で割って誕生した。"],
["娘ペルセポネが冥界へ連れ去られ、悲しみのあまり大地を不毛にした女神。","デメテル","農耕の女神。この神話が季節の起源とされる。"],
["最も美しい女神に贈られる黄金のリンゴをめぐり、パリスの審判で勝者となった女神。","アフロディテ","愛と美の女神。パリスにヘレネを与える約束をした。"],
["生まれてすぐ揺りかごを抜け出し、兄アポロンの牛を盗んだ神。","ヘルメス","旅人と商人の神。盗みの代償に竪琴をアポロンに贈った。"],
["デルポイで大蛇ピュトンを退治し、神託の主となった神。","アポロン","太陽・音楽・予言の神。デルポイの神託所で知られる。"],
["狩りの最中に水浴びを見た青年アクタイオンを、鹿に変えた女神。","アルテミス","狩猟と月の女神。アポロンの双子の姉妹。"],
["網で妻とその愛人を捕らえ、神々の笑いものにした鍛冶の神。","ヘパイストス","妻アフロディテとアレスの密通を、見えない網で暴いた。"],
["ミダス王に「触れるものすべてが黄金になる力」を与えた、ぶどう酒の神。","ディオニュソス","酒と演劇の神。王の願いを叶えたが、王は後悔した。"],
["夫の浮気相手や、その子ヘラクレスを執拗に迫害した女神。","ヘラ","結婚と家庭の女神。ゼウスの正妻。"],
["オリュンポスの神々から火を盗んで人間に与え、岩に縛られて鷲に肝臓をついばまれた神。","プロメテウス","ティタン神族。人類の恩人だが、ゼウスの怒りを買った。"],
["ザクロの実を食べたため、一年の三分の一を冥界で過ごすことになった女神。","ペルセポネ","春の女神で冥界の女王。母デメテルとの再会が季節を作った。"],
["我が子を次々と飲み込んだが、末子ゼウスに倒された、ティタン神族の王。","クロノス","時の神ともされる。ゼウスが吐き出させた兄弟姉妹に倒された。"],
["十二の功業を成し遂げた、ゼウスの子の半神の英雄。","ヘラクレス","ネメアの獅子退治やケルベロス捕獲などを成し遂げた。"],
["ゴルゴンの一人メドゥーサの首を取り、アンドロメダを救った英雄。","ペルセウス","アテナの盾とヘルメスの剣を借りて討ち取った。"],
["迷宮ラビュリントスで怪物ミノタウロスを倒し、アリアドネの糸で脱出した英雄。","テセウス","アテネの王子。クレタ島の迷宮で怪物を退治した。"],
["亡き妻エウリュディケを連れ戻そうと冥界へ行ったが、振り返って失敗した竪琴の名手。","オルフェウス","振り返らない約束を破り、妻を永遠に失った。"],
["戦いと殺戮を好み、ゼウスにすら嫌われたと言われる戦争の神。","アレス","アフロディテの愛人。トロイア戦争では傷を負って嘆いた。"]
];
const N=["ゼウス","ヘラ","ポセイドン","デメテル","ハデス","アテナ","アポロン","アルテミス","アレス","アフロディテ","ヘパイストス","ヘルメス","ディオニュソス","ペルセポネ","プロメテウス","クロノス","ヘラクレス","ペルセウス","テセウス","オルフェウス","ヘスティア","エロス","パン","ヘカテ","オデュッセウス"];
const $=i=>document.getElementById(i);
let order,idx,score,rec;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function start(){order=sh(D).slice(0,10);idx=0;score=0;rec=[];$("start").classList.add("hide");$("end").classList.add("hide");$("game").classList.remove("hide");show()}
function show(){
 const d=order[idx];
 $("no").textContent="第"+(idx+1)+"問 / "+order.length+"問";
 $("sc").textContent="正解 "+score;
 $("pb").style.width=(idx/order.length*100)+"%";
 $("q").textContent=d[0];
 $("fb").classList.add("hide");
 const wrong=sh(N.filter(n=>n!==d[1])).slice(0,3);
 const box=$("opts");box.innerHTML="";
 sh([d[1],...wrong]).forEach(n=>{
  const b=document.createElement("button");b.textContent=n;b.onclick=()=>pick(b,n);box.appendChild(b)});
}
function pick(btn,n){
 const d=order[idx],right=n===d[1];
 rec.push({q:d[0],a:n,c:d[1],e:d[2],ok:right});
 if(right)score++;
 document.querySelectorAll("#opts button").forEach(b=>{b.disabled=true;if(b.textContent===d[1])b.classList.add("ok")});
 if(!right)btn.classList.add("ng");
 $("res").textContent=right?"正解です":"正解は「"+d[1]+"」です";
 $("exp").textContent=d[2];
 $("sc").textContent="正解 "+score;
 $("next").textContent=idx+1<order.length?"次の問題":"結果を見る";
 $("fb").classList.remove("hide");
 $("next").focus();
}
$("next").onclick=()=>{idx++;if(idx<order.length)show();else finish()};
function finish(){
 $("game").classList.add("hide");$("end").classList.remove("hide");
 $("fs").textContent=score+" / "+order.length;
 $("rv").innerHTML=rec.map((x,i)=>`<div class="it ${x.ok?'o':'x'}"><div class="h">第${i+1}問　${x.ok?'○ 正解':'× 不正解'}</div><div>${x.q}</div><div class="a">あなたの答え：${x.a}${x.ok?'':'<br>正解：'+x.c}</div><div class="e">${x.e}</div><a href="https://ja.wikipedia.org/w/index.php?search=${encodeURIComponent(x.c)}" target="_blank" rel="noopener">${x.c}について調べる</a></div>`).join("");
 const r=score/order.length;
 $("msg").textContent=r>=.9?"神話の達人です。オリュンポス山にお迎えします。":r>=.7?"かなりの神話通です。":r>=.4?"あと一歩です。もう一度挑戦してみましょう。":"まずは神々の顔ぶれから覚えていきましょう。";
}
$("go").onclick=start;$("again").onclick=start;
</script>
</body>
</html>
